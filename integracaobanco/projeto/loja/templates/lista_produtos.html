<table>
    <thead>
        <th>Id</th>
        <th>Nome</th>
        <th>Preço</th>
        <th>Categoria</th>
    </thead>
    <tbody>
        {% for produto in produtos %}
        <tr>
            <td>{{produto.id}}</td>
            <td>{{produto.nome}}</td>
            <td>{{produto.preco}}</td>
            <td>{{produto.categoria}}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
