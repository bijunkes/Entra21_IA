<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes</title>
</head>
<body>
    <h1>Clientes</h1>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Telefone</th>
            </tr>
        </thead>
        <tbody>
            {% for cliente in clientes %}
            <tr>
                <td>{{cliente.id}}</td>
                <td>{{cliente.nome}}</td>
                <td>{{cliente.email}}</td>
                <td>{{cliente.telefone}}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <nav>
        <a href="{% url 'clientes' %}">Clientes</a> |
        <a href="{% url 'produtos' %}">Produtos</a> |
        <a href="{% url 'vendas' %}">Vendas</a>
    </nav>
</body>
</html>
